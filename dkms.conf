PACKAGE_NAME="ms912x"
PACKAGE_VERSION="0.3"
CLEAN="make KVER=${kernelver} KSRC=${kernel_source_dir} clean"
MAKE[0]="make KVER=${kernelver} KSRC=${kernel_source_dir} all"
BUILT_MODULE_NAME[0]="ms912x"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_LOCATION[0]="/kernel/drivers/gpu/drm/"
# This code base targets Linux 7.2+; upstream has separate branches for older kernels
BUILD_EXCLUSIVE_KERNEL="^(7\.([2-9]|[1-9][0-9])|([8-9]|[1-9][0-9])\.)"
AUTOINSTALL="yes"
